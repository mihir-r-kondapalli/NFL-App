[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fourth-and-sim"
version = "2.0.0"
description = "Reproducible NFL analytics and a shared football simulation engine"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
training = ["torch==2.6.0", "numpy==1.26.4"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
nflsim = "nflsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
